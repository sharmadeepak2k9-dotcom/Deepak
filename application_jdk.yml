---
- name: Pre-checks for JDK update
  hosts: "{{ host_filter }}"
  gather_facts: false

  tasks:
    - name: Verify host connectivity
      ansible.builtin.ping:
      register: ping_result

    - name: Display connectivity status
      ansible.builtin.debug:
        msg: "Host is reachable"
      when: ping_result.ping == "pong"

    - name: Check running Java processes
      ansible.builtin.shell: pgrep -af java
      register: java_processes
      changed_when: false
      failed_when: false

    - name: Display Java processes
      ansible.builtin.debug:
        var: java_processes.stdout_lines

    - name: Verify tcserver user access
      ansible.builtin.command: whoami
      become: true
      become_user: tcserver
      register: tcserver_user_check
      changed_when: false

    - name: Display tcserver user validation
      ansible.builtin.debug:
        msg: "Executing as {{ tcserver_user_check.stdout }}"

###############################################################################

- name: Update JDK for tcServer
  hosts: "{{ host_filter }}"
  become: true

  vars:
    tcserver_user: tcserver
    tcserver_group: nexlynk
    tcserver_service_name: tcServer

    old_jdk_version: "jdk8u{{oldjdk}}-{{oldbd}}"
    new_jdk_version: "jdk8u{{newjdk}}-{{newbd}}"

    expected_java_version: "1.8.0_{{newjdk}}"

    jdk_archive: "/home/tcserver/OpenJDK8U-jdk_x64_linux_hotspot_8u{{newjdk}}{{newjdk}}.tar.gz"

    jdk_base: "{{ tc_base }}/java"
    tcserver_instance_dir: "{{ tc_base }}/tcserver/pivotal-tc-server/instances/nexlynkdms"
    setenv_file: "{{ tcserver_instance_dir }}/bin/setenv.sh"

  tasks:

    - name: Ensure JDK base directory exists
      ansible.builtin.file:
        path: "{{ jdk_base }}"
        state: directory
        owner: "{{ tcserver_user }}"
        group: "{{ tcserver_group }}"
        mode: "0755"

    - name: List JDK directory contents before update
      ansible.builtin.command: ls -lrt
      args:
        chdir: "{{ jdk_base }}"
      become_user: "{{ tcserver_user }}"
      register: ls_before
      changed_when: false

    - name: Display JDK directory contents before update
      ansible.builtin.debug:
        var: ls_before.stdout_lines

    - name: Verify tcServer instance directory exists
      ansible.builtin.stat:
        path: "{{ tcserver_instance_dir }}"
      register: tcserver_dir

    - name: Fail if tcServer instance directory is missing
      ansible.builtin.fail:
        msg: "tcServer instance directory not found: {{ tcserver_instance_dir }}"
      when: not tcserver_dir.stat.exists

    - name: Verify JDK archive exists
      ansible.builtin.stat:
        path: "{{ jdk_archive }}"
      register: jdk_archive_stat

    - name: Fail if JDK archive is missing
      ansible.builtin.fail:
        msg: "JDK archive not found: {{ jdk_archive }}"
      when: not jdk_archive_stat.stat.exists

    - name: Extract new JDK
      ansible.builtin.unarchive:
        src: "{{ jdk_archive }}"
        dest: "{{ jdk_base }}"
        remote_src: true
        creates: "{{ jdk_base }}/{{ new_jdk_version }}"
      become_user: "{{ tcserver_user }}"

    - name: Verify extracted JDK directory exists
      ansible.builtin.stat:
        path: "{{ jdk_base }}/{{ new_jdk_version }}"
      register: extracted_jdk

    - name: Fail if extracted JDK directory is missing
      ansible.builtin.fail:
        msg: "Expected extracted JDK directory not found: {{ jdk_base }}/{{ new_jdk_version }}"
      when: not extracted_jdk.stat.exists

    - name: Verify setenv.sh exists
      ansible.builtin.stat:
        path: "{{ setenv_file }}"
      register: setenv_stat

    - name: Fail if setenv.sh does not exist
      ansible.builtin.fail:
        msg: "{{ setenv_file }} not found"
      when: not setenv_stat.stat.exists

    - name: Update JDK version in setenv.sh
      ansible.builtin.replace:
        path: "{{ setenv_file }}"
        regexp: "{{ old_jdk_version | regex_escape }}"
        replace: "{{ new_jdk_version }}"
        backup: true
      register: setenv_update

    - name: Display update status
      ansible.builtin.debug:
        msg: "JDK reference updated in setenv.sh: {{ setenv_update.changed }}"

    - name: Display backup file
      ansible.builtin.debug:
        msg: "Backup created: {{ setenv_update.backup_file }}"
      when:
        - setenv_update.changed
        - setenv_update.backup_file is defined

    ###########################################################################
    # Restart tcServer only if JDK reference changed
    ###########################################################################

    - name: Restart tcServer after JDK update
      when: setenv_update.changed
      block:

        - name: Stop tcServer service
          ansible.builtin.command: systemctl stop {{ tcserver_service_name }}
          register: stop_result

        - name: Verify tcServer service is stopped
          ansible.builtin.command: systemctl is-active {{ tcserver_service_name }}
          register: stop_status
          changed_when: false
          failed_when: stop_status.stdout not in ['inactive', 'failed']

        - name: Start tcServer service
          ansible.builtin.command: systemctl start {{ tcserver_service_name }}
          register: start_result

        - name: Wait for tcServer service to become active
          ansible.builtin.command: systemctl is-active {{ tcserver_service_name }}
          register: start_status
          retries: 12
          delay: 10
          until: start_status.stdout == "active"
          changed_when: false

        - name: Wait for application startup
          ansible.builtin.pause:
            seconds: 30

        - name: Display tcServer service status
          ansible.builtin.command: systemctl status {{ tcserver_service_name }} --no-pager
          register: service_status
          changed_when: false

        - name: Display service status output
          ansible.builtin.debug:
            var: service_status.stdout_lines

        - name: Verify Java processes are running
          ansible.builtin.shell: pgrep -af java
          register: tcserver_process_check
          changed_when: false
          failed_when: false

        - name: Display running Java processes
          ansible.builtin.debug:
            var: tcserver_process_check.stdout_lines

        - name: Assert tcServer started successfully
          ansible.builtin.assert:
            that:
              - start_status.stdout == "active"
              - tcserver_process_check.stdout != ""
            fail_msg: "tcServer restart failed."
            success_msg: "tcServer restarted successfully."

      rescue:

        - name: Display stop result
          ansible.builtin.debug:
            var: stop_result
          when: stop_result is defined

        - name: Display start result
          ansible.builtin.debug:
            var: start_result
          when: start_result is defined

        - name: Capture failed service status
          ansible.builtin.command: systemctl status {{ tcserver_service_name }} --no-pager
          register: failed_service_status
          changed_when: false
          failed_when: false

        - name: Display failed service status
          ansible.builtin.debug:
            var: failed_service_status.stdout_lines

        - name: Fail restart process
          ansible.builtin.fail:
            msg: "tcServer restart failed after JDK update."

    ###########################################################################
    # Validation
    ###########################################################################

    - name: Verify setenv.sh contains new JDK version
      ansible.builtin.command:
        cmd: grep {{ new_jdk_version }} {{ setenv_file }}
      register: setenv_validation
      changed_when: false

    - name: Display setenv.sh validation
      ansible.builtin.debug:
        var: setenv_validation.stdout_lines

    - name: Execute java -version from new JDK
      ansible.builtin.shell: |
        {{ jdk_base }}/{{ new_jdk_version }}/bin/java -version 2>&1
      become_user: "{{ tcserver_user }}"
      register: java_version
      changed_when: false

    - name: Display Java version
      ansible.builtin.debug:
        var: java_version.stdout_lines

    - name: Validate expected Java version
      ansible.builtin.assert:
        that:
          - expected_java_version in java_version.stdout
        fail_msg: |
          JDK validation failed.
          Expected: {{ expected_java_version }}
          Actual output:
          {{ java_version.stdout }}
        success_msg: |
          JDK successfully upgraded to {{ expected_java_version }}

    - name: List tcServer instance directory after update
      ansible.builtin.command: ls -lrt
      args:
        chdir: "{{ tcserver_instance_dir }}"
      become_user: "{{ tcserver_user }}"
      register: ls_after
      changed_when: false

    - name: Display tcServer instance directory contents
      ansible.builtin.debug:
        var: ls_after.stdout_lines