---
- name: JDK Update for HCOMM - Prechecks
  hosts: "{{ host_filter }}"
  gather_facts: false

  tasks:

    - name: Ping target host
      ansible.builtin.ping:
      register: ping_result

    - name: Show success message
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} is reachable"
      when: ping_result.ping == 'pong'

    - name: Check for Java processes
      ansible.builtin.shell: pgrep -af java
      register: ps_result
      changed_when: false
      failed_when: false

    - name: Show Java process output
      ansible.builtin.debug:
        var: ps_result.stdout_lines

    - name: Verify hcomm user access
      ansible.builtin.command: whoami
      become: true
      become_user: hcomm
      register: hcomm_user_check
      changed_when: false

    - name: Show hcomm user result
      ansible.builtin.debug:
        msg: "Executing as {{ hcomm_user_check.stdout }}"


- name: Upgrade JDK and Restart HCOMM
  hosts: "{{ host_filter }}"
  become: true
  gather_facts: false

  vars:
    # JDK Version Parameters
    old_jdk_major: "17.0.19"
    old_jdk_build: "10"
    new_jdk_major: "17.0.20"
    new_jdk_build: "8"

    # JDK Archive
    jdk_archive: "/home/hcomm/OpenJDK17U-jdk_x64_linux_hotspot_{{old_jdk_major}}_{{old_jdk_build}}.tar.gz"

    # Derived Variables
    new_jdk_version: "{{ new_jdk_major }}+{{ new_jdk_build }}"
    jdk_dir_name: "jdk-{{ new_jdk_version }}"

    # HCOMM Variables
    jdk_base: "{{ hc_base }}/java"
    hcomm_instance_dir: "{{ hc_base }}/hcomm/hconnect"
    hcomm_service_name: "hcomm"

  tasks:

    - name: Ensure JDK base directory exists
      ansible.builtin.file:
        path: "{{ jdk_base }}"
        state: directory
        mode: "0755"

    - name: List contents of JDK directory before change
      ansible.builtin.command: ls -lrt
      args:
        chdir: "{{ jdk_base }}"
      become_user: hcomm
      register: ls_before
      changed_when: false

    - name: Show listing before operations
      ansible.builtin.debug:
        var: ls_before.stdout_lines

    - name: Verify JDK archive exists
      ansible.builtin.stat:
        path: "{{ jdk_archive }}"
      register: jdk_archive_stat

    - name: Fail if JDK archive is missing
      ansible.builtin.fail:
        msg: "JDK archive {{ jdk_archive }} does not exist"
      when: not jdk_archive_stat.stat.exists

    - name: Check HCOMM instance directory exists
      ansible.builtin.stat:
        path: "{{ hcomm_instance_dir }}"
      register: hcomm_instance_dir_stat

    - name: Fail if HCOMM instance directory is missing
      ansible.builtin.fail:
        msg: "Instance directory {{ hcomm_instance_dir }} does not exist"
      when: not hcomm_instance_dir_stat.stat.exists

    - name: Extract JDK archive
      ansible.builtin.unarchive:
        src: "{{ jdk_archive }}"
        dest: "{{ jdk_base }}"
        remote_src: true

    - name: Verify extracted JDK exists
      ansible.builtin.stat:
        path: "{{ jdk_base }}/{{ jdk_dir_name }}"
      register: extracted_jdk

    - name: Fail if JDK extraction failed
      ansible.builtin.fail:
        msg: "JDK extraction failed. Directory {{ jdk_base }}/{{ jdk_dir_name }} not found."
      when: not extracted_jdk.stat.exists

    - name: Check if hcommservice.sh exists
      ansible.builtin.stat:
        path: "{{ hcomm_instance_dir }}/hcommservice.sh"
      register: hcommservice_stat
      become_user: hcomm

    - name: Fail if hcommservice.sh is missing
      ansible.builtin.fail:
        msg: "{{ hcomm_instance_dir }}/hcommservice.sh not found"
      when: not hcommservice_stat.stat.exists

    - name: Capture current JDK reference
      ansible.builtin.shell: >
        grep -o 'jdk-17\.0\.[0-9]\+\+[0-9]\+'
        {{ hcomm_instance_dir }}/hcommservice.sh | head -1
      register: current_jdk
      changed_when: false
      failed_when: false
      become_user: hcomm

    - name: Show current JDK reference
      ansible.builtin.debug:
        msg: "Current JDK: {{ current_jdk.stdout | default('Not Found') }}"

    - name: Update JDK version in hcommservice.sh
      ansible.builtin.replace:
        path: "{{ hcomm_instance_dir }}/hcommservice.sh"
        regexp: 'jdk-17\.0\.[0-9]+\+[0-9]+'
        replace: "{{ jdk_dir_name }}"
        backup: true
      register: replace_result
      become_user: hcomm

    - name: Display update result
      ansible.builtin.debug:
        msg:
          - "Target JDK: {{ jdk_dir_name }}"
          - "Configuration Updated: {{ replace_result.changed }}"

    - name: Restart HCOMM service after JDK update
      when: replace_result.changed
      block:

        - name: Restart HCOMM service
          ansible.builtin.systemd:
            name: "{{ hcomm_service_name }}"
            state: restarted
          register: restart_result

        - name: Wait for application startup
          ansible.builtin.pause:
            seconds: 30

        - name: Get HCOMM service status
          ansible.builtin.systemd:
            name: "{{ hcomm_service_name }}"
          register: service_status

        - name: Display HCOMM service status
          ansible.builtin.debug:
            msg:
              - "Service: {{ hcomm_service_name }}"
              - "State: {{ service_status.status.ActiveState }}"
              - "SubState: {{ service_status.status.SubState }}"

        - name: Verify Java processes are running
          ansible.builtin.shell: pgrep -af java
          register: hcomm_process_check
          changed_when: false
          failed_when: false

        - name: Display running Java processes
          ansible.builtin.debug:
            var: hcomm_process_check.stdout_lines

        - name: Assert HCOMM restarted successfully
          ansible.builtin.assert:
            that:
              - service_status.status.ActiveState == "active"
              - hcomm_process_check.stdout != ""
            fail_msg: "HCOMM restart failed."
            success_msg: "HCOMM restarted successfully"